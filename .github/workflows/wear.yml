name: Build Wear OS APK

# The watch APK is built here rather than locally so anyone can download a
# working build from the Actions tab without installing Android Studio.

on:
  push:
    paths:
      - 'wear/**'
      - 'watch/**'
      - 'cal/**'
      - '.github/workflows/wear.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: wear
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Report APK
        working-directory: wear
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sam-calendar-wear-debug
          path: wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
