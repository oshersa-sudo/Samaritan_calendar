name: Build Wear OS APK

# The watch APK is built here rather than locally so anyone can download a
# working build from the Actions tab without installing Android Studio.

on:
  push:
    paths:
      - 'wear/**'
      - 'watch/**'
      - 'cal/**'
      - '.github/workflows/wear.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # No --stacktrace: it buries the actual message under a few hundred
      # frames of Gradle internals, which is useless when reading the log tail.
      - name: Build debug APK
        working-directory: wear
        run: gradle assembleDebug --no-daemon

      # A green build does not prove the web build and calendar files were
      # copied in — a silently empty assets copy would ship an APK that opens
      # to "הלוח לא נטען". Assert the contents instead of assuming.
      - name: Verify bundled assets
        working-directory: wear
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          list=$(unzip -l "$apk")
          for required in assets/watch/index.html assets/watch/sw.js assets/Sam_font.ttf; do
            grep -qF "$required" <<<"$list" || { echo "::error::$required missing from the APK"; exit 1; }
          done
          years=$(grep -cE 'assets/cal/[0-9]{4}\.dat' <<<"$list" || true)
          echo "calendar years bundled: $years"
          [ "$years" -ge 2 ] || { echo "::error::expected at least 2 bundled year files, found $years"; exit 1; }
          grep -E 'assets/(watch/|cal/|Sam_font)' <<<"$list"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sam-calendar-wear-debug
          path: wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
